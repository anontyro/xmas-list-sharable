<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome - Family Gifts</title>
<link rel="stylesheet" href="../styles/sticker.css">
</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>

<div class="pg">
<main class="split">
  <div class="l">
    <div class="stks">
      <img class="stk" src="../icons/gingerbread.png" alt="" style="transform:rotate(-8deg)">
      <img class="stk" src="../icons/tree.png" alt="">
      <img class="stk" src="../icons/star.png" alt="" style="transform:rotate(12deg)">
    </div>
    <h1>Family<br>Gifts</h1>
    <span class="pill yel">Christmas 2026</span>
  </div>

  <div class="r">
    <div class="seg">
      <button class="btn sel">I'm shopping</button>
      <button class="btn">I own a list</button>
    </div>
    <h2 class="disp" style="font-size:30px;line-height:1.05">Welcome! What should we call you?</h2>
    <div>
      <label class="lbl" for="nm">Your name</label>
      <input id="nm" class="inp" type="text" value="Sam">
      <p class="help">The family sees this next to gifts you reserve. No password needed.</p>
    </div>
    <button class="btn red blk xl">Let's go</button>
    <div class="note sky">
      <img class="stk" src="../icons/badge.png" alt="">
      <div class="c" style="gap:8px">
        <p>Been here before on another phone or laptop? Use your saved recovery link to get your planner back.</p>
        <button class="btn sm" style="align-self:flex-start">Use recovery link</button>
      </div>
    </div>
  </div>
</main>
</div>

</body>
</html>
