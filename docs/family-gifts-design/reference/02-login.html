<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner login - Family Gifts</title>
<link rel="stylesheet" href="../styles/sticker.css">
</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>

<div class="pg">
<main class="split">
  <div class="l">
    <div class="stks">
      <img class="stk" src="../icons/gingerbread.png" alt="" style="transform:rotate(-8deg)">
      <img class="stk" src="../icons/tree.png" alt="">
      <img class="stk" src="../icons/star.png" alt="" style="transform:rotate(12deg)">
    </div>
    <h1>Family<br>Gifts</h1>
    <span class="pill yel">Christmas 2026</span>
  </div>

  <div class="r">
    <div class="seg">
      <button class="btn">I'm shopping</button>
      <button class="btn sel">I own a list</button>
    </div>
    <div>
      <p class="lbl">Whose list?</p>
      <div class="r fw" style="gap:8px">
        <button class="btn sm sel">Sarah</button>
        <button class="btn sm">Alex</button>
        <button class="btn sm">Nana</button>
        <button class="btn sm">Mia</button>
      </div>
    </div>
    <div>
      <label class="lbl" for="pin">Your PIN</label>
      <input id="pin" class="inp" type="password" inputmode="numeric" autocomplete="current-password" value="482916">
      <p class="help">6 or more digits. Too many wrong tries pauses sign-in for a few minutes.</p>
    </div>
    <button class="btn red blk xl">Open my list</button>
    <p class="help" style="text-align:center">Lost your PIN? Ask the family admin.</p>
  </div>
</main>
</div>

</body>
</html>
