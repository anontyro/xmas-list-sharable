<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account menu - Family Gifts</title>
<link rel="stylesheet" href="../styles/sticker.css">
</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>

<div class="pg">
  <header class="bar">
    <button class="brand"><img class="stk" src="../icons/tree.png" alt="">Family Gifts</button>
    <nav class="links" aria-label="Main">
      <button class="lnk on">Family</button>
      <button class="lnk">Wishlist</button>
      <button class="lnk">My planner</button>
    </nav>
    <div class="who" style="position:relative">
      <button class="chip" aria-haspopup="menu" aria-expanded="true" style="box-shadow:0 3px 0 #1F2A44"><span class="av2 bgy">S</span>Sam <span aria-hidden="true">▴</span></button>
      <div role="menu" aria-label="Account" style="position:absolute;right:0;top:54px;width:290px;z-index:5;background:#fff;border:3px solid #1F2A44;border-radius:18px;box-shadow:4px 4px 0 #1F2A44;padding:8px;display:flex;flex-direction:column;gap:2px;color:#1F2A44">
        <div style="padding:6px 10px 10px;border-bottom:2px dashed #1F2A44;margin-bottom:4px">
          <p class="ttl" style="font-size:17px">Sam</p>
          <p class="mut" style="font-size:13px;font-weight:700">Shopping on this device</p>
        </div>
        <button role="menuitem" style="display:flex;align-items:center;gap:10px;min-height:46px;padding:0 10px;border-radius:10px;font-weight:800;font-size:15px;text-align:left;width:100%">Change my name</button>
        <button role="menuitem" style="display:flex;align-items:center;gap:10px;min-height:46px;padding:0 10px;border-radius:10px;font-weight:800;font-size:15px;text-align:left;width:100%;background:#BDE0FE">Save access (recovery link)</button>
        <button role="menuitem" style="display:flex;align-items:center;gap:10px;min-height:46px;padding:0 10px;border-radius:10px;font-weight:800;font-size:15px;text-align:left;width:100%">My planner</button>
        <button role="menuitem" style="display:flex;align-items:center;gap:10px;min-height:46px;padding:0 10px;border-radius:10px;font-weight:800;font-size:15px;text-align:left;width:100%">I own a list (PIN)</button>
        <div style="border-top:2px dashed #1F2A44;margin-top:4px;padding-top:4px">
          <button role="menuitem" style="display:flex;align-items:center;gap:10px;min-height:46px;padding:0 10px;border-radius:10px;font-weight:800;font-size:15px;text-align:left;width:100%;color:#B3262B">Sign out of this device</button>
          <p class="help" style="margin:0 10px 6px">You'll need your recovery link to get back in.</p>
        </div>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-in">
      <div>
        <h1 class="h1">Christmas 2026</h1>
        <p class="sub">Hi Sam! Pick a list to browse.</p>
      </div>
    </div>
  </section>

  <main class="wrap">
    <div class="grid c3">
      <article class="card r">
        <div class="av bgy">S</div>
        <div class="g"><h2 class="h3d">Sarah</h2><p class="mut" style="font-weight:800;font-size:14px">Christmas 2026 · 5 gifts</p></div>
        <button class="btn red sm" aria-label="Open Sarah's list">Open</button>
      </article>
      <article class="card r">
        <div class="av bgp">A</div>
        <div class="g"><h2 class="h3d">Alex</h2><p class="mut" style="font-weight:800;font-size:14px">Christmas 2026 · 7 gifts</p></div>
        <button class="btn red sm" aria-label="Open Alex's list">Open</button>
      </article>
    </div>
  </main>

  <nav class="tabs" aria-label="Main">
    <button class="tab on"><img src="../icons/tree.png" alt="">Family</button>
    <button class="tab"><img src="../icons/heartlist.png" alt="">Wishlist</button>
    <button class="tab"><img src="../icons/wallet.png" alt="">Planner</button>
  </nav>
</div>

</body>
</html>
